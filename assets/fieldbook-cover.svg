<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 680" role="img" aria-labelledby="title desc">
<title id="title">Places, plates and perspective. A personal travel fieldbook.</title>
<desc id="desc">An editorial travel journal cover with staggered kinetic typography, a traced route, a taped portrait and printed-paper details.</desc>
<defs>
 <clipPath id="coverPhoto"><path d="M905 91L1324 112L1304 570L884 548Z"/></clipPath>
 <pattern id="paperLines" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M0 27.5H28" stroke="#B9AD98" stroke-opacity=".12" stroke-width=".7"/></pattern>
 <clipPath id="coverCopy"><rect x="82" y="580" width="0" height="65"><animate attributeName="width" values="0;720" begin="2.15s" dur="1.1s" fill="freeze"/></rect></clipPath>
</defs>
<rect width="1440" height="680" rx="8" fill="#F1E7D7"/><rect width="1440" height="680" rx="8" fill="url(#paperLines)"/>
<rect x="24" y="24" width="1392" height="632" fill="none" stroke="#2F6B50" stroke-opacity=".42"/><path d="M58 55H1382" stroke="#26312C" stroke-opacity=".45"/>
<g opacity="0"><text x="62" y="46" font-family="'IBM Plex Mono',monospace" font-size="12" letter-spacing="2.3" fill="#26312C">THE PERSONAL FIELD BOOK</text><animate attributeName="opacity" values="0;1" begin=".1s" dur=".45s" fill="freeze"/><animate attributeName="letter-spacing" values="5px;2.3px" begin=".1s" dur=".55s" fill="freeze"/></g>
<text x="1378" y="46" text-anchor="end" font-family="'IBM Plex Mono',monospace" font-size="12" letter-spacing="2" fill="#D34E35">VOL. 01 / PLACES &amp; PLATES</text>
<path d="M93 112C205 62 270 165 386 124S553 93 627 151S740 175 823 130" fill="none" stroke="#2F6B50" stroke-width="2.1" stroke-dasharray="3 9" stroke-linecap="round"/>
<path d="M93 112C205 62 270 165 386 124S553 93 627 151S740 175 823 130" fill="none" stroke="#D34E35" stroke-width="2.4" pathLength="1" stroke-dasharray="0 1" stroke-linecap="round"><animate attributeName="stroke-dasharray" values="0 1;1 0" begin=".15s" dur="1.65s" fill="freeze"/></path>
<circle cx="93" cy="112" r="5" fill="#D34E35"/><circle cx="823" cy="130" r="5" fill="#D34E35"/><path d="M807 119L824 130L806 138" fill="none" stroke="#D34E35" stroke-width="2"/>
<g opacity="0"><text x="78" y="193" font-family="'Barlow Condensed',Impact,sans-serif" font-size="19" letter-spacing="3" fill="#2F6B50">A TRAVEL JOURNAL, NOT A CHECKLIST</text><animate attributeName="opacity" values="0;1" begin=".25s" dur=".35s" fill="freeze"/><animate attributeName="letter-spacing" values="7px;3px" begin=".25s" dur=".55s" fill="freeze"/></g>
<g opacity="0"><text x="72" y="315" font-family="'DM Serif Display',Georgia,serif" font-size="112" letter-spacing="-3" fill="#26312C">Places,</text><animate attributeName="opacity" values="0;1" begin=".45s" dur=".6s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 32;0 0" begin=".45s" dur=".72s" calcMode="spline" keySplines=".18 .82 .22 1" fill="freeze"/></g>
<g opacity="0"><text x="72" y="416" font-family="'DM Serif Display',Georgia,serif" font-size="112" font-style="italic" letter-spacing="-4" fill="#D34E35">plates &amp;</text><animate attributeName="opacity" values="0;1" begin=".95s" dur=".55s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="-34 0;0 0" begin=".95s" dur=".68s" calcMode="spline" keySplines=".2 .78 .2 1" fill="freeze"/><animate attributeName="letter-spacing" values="5px;-4px" begin=".95s" dur=".7s" fill="freeze"/></g>
<g opacity="0"><text x="72" y="518" font-family="'Barlow Condensed',Impact,sans-serif" font-size="112" font-weight="600" letter-spacing="5" fill="#26312C">PERSPECTIVE.</text><animate attributeName="opacity" values="0;1" begin="1.48s" dur=".48s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 30;0 0" begin="1.48s" dur=".62s" calcMode="spline" keySplines=".18 .82 .22 1" fill="freeze"/><animate attributeName="letter-spacing" values="14px;5px" begin="1.48s" dur=".8s" fill="freeze"/></g>
<path d="M82 548C182 569 288 555 393 570" fill="none" stroke="#D34E35" stroke-width="4" stroke-linecap="round" pathLength="1" stroke-dasharray="0 1"><animate attributeName="stroke-dasharray" values="0 1;1 0" begin="2.05s" dur=".72s" fill="freeze"/></path>
<g clip-path="url(#coverCopy)"><text x="84" y="601" font-family="'DM Sans',Arial,sans-serif" font-size="20" fill="#39433D">I travel to see a little further,</text><text x="84" y="630" font-family="'DM Sans',Arial,sans-serif" font-size="20" fill="#39433D">taste something new, and bring a story home.</text></g>

<!-- A designed ticket panel, not an empty photo placeholder. The real portraits sit in the journal's photo spread below. -->
<g transform="translate(887 91) rotate(2)">
  <rect width="442" height="465" fill="#2F6B50"/>
  <rect x="18" y="18" width="406" height="429" fill="#F8F0E1" stroke="#26312C" stroke-width="1.5"/>
  <path d="M34 40H408" stroke="#D34E35" stroke-width="2"/>
  <text x="42" y="70" font-family="'IBM Plex Mono',monospace" font-size="11" letter-spacing="2" fill="#2F6B50">TRAVELER'S INDEX / 001</text>
  <text x="40" y="178" font-family="'DM Serif Display',Georgia,serif" font-size="65" fill="#26312C">Go out.</text>
  <text x="40" y="246" font-family="'DM Serif Display',Georgia,serif" font-size="65" font-style="italic" fill="#D34E35">Look closer.</text>
  <text x="42" y="302" font-family="'Barlow Condensed',Impact,sans-serif" font-size="23" letter-spacing="3" fill="#26312C">PLACES / PLATES / PEOPLE</text>
  <path d="M42 331H370" stroke="#C88C19" stroke-width="3"/>
  <text x="42" y="376" font-family="'Caveat',cursive" font-size="35" fill="#2F6B50">Keep a little room</text>
  <text x="42" y="412" font-family="'Caveat',cursive" font-size="35" fill="#2F6B50">for the unexpected.</text>
  <circle cx="358" cy="68" r="25" fill="#267B9A"/>
  <path d="M346 68H370M358 56V80" stroke="#F8F0E1" stroke-width="2"/>
  <path d="M18 18L42 18L18 42Z M424 405L424 447L382 447Z" fill="#C88C19"/>
</g>
<text x="900" y="614" font-family="'Caveat',cursive" font-size="30" fill="#2F6B50" transform="rotate(-3 900 614)">leave room for one more bite</text>
<text x="1376" y="632" text-anchor="end" font-family="'IBM Plex Mono',monospace" font-size="11" letter-spacing="2" fill="#2F6B50">OPEN THE NOTEBOOK →</text>
</svg>