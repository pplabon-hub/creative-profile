<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 680" role="img" aria-labelledby="title desc">
<title id="title">Places, plates and perspective. A personal travel fieldbook.</title>
<desc id="desc">An editorial travel journal cover with staggered kinetic typography, a traced route, a taped portrait and printed-paper details.</desc>
<defs>
 <clipPath id="coverPhoto"><path d="M905 91L1324 112L1304 570L884 548Z"/></clipPath>
 <pattern id="paperLines" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M0 27.5H28" stroke="#B9AD98" stroke-opacity=".12" stroke-width=".7"/></pattern>
 <clipPath id="coverCopy"><rect x="82" y="580" width="0" height="65"><animate attributeName="width" values="0;720" begin="2.15s" dur="1.1s" fill="freeze"/></rect></clipPath>
</defs>
<rect width="1440" height="680" rx="8" fill="#F1E7D7"/><rect width="1440" height="680" rx="8" fill="url(#paperLines)"/>
<rect x="24" y="24" width="1392" height="632" fill="none" stroke="#536D60" stroke-opacity=".42"/><path d="M58 55H1382" stroke="#26312C" stroke-opacity=".45"/>
<g opacity="0"><text x="62" y="46" font-family="'IBM Plex Mono',monospace" font-size="12" letter-spacing="2.3" fill="#26312C">THE PERSONAL FIELD BOOK</text><animate attributeName="opacity" values="0;1" begin=".1s" dur=".45s" fill="freeze"/><animate attributeName="letter-spacing" values="5px;2.3px" begin=".1s" dur=".55s" fill="freeze"/></g>
<text x="1378" y="46" text-anchor="end" font-family="'IBM Plex Mono',monospace" font-size="12" letter-spacing="2" fill="#A84F3A">VOL. 01 / PLACES &amp; PLATES</text>
<path d="M93 112C205 62 270 165 386 124S553 93 627 151S740 175 823 130" fill="none" stroke="#536D60" stroke-width="2.1" stroke-dasharray="3 9" stroke-linecap="round"/>
<path d="M93 112C205 62 270 165 386 124S553 93 627 151S740 175 823 130" fill="none" stroke="#A84F3A" stroke-width="2.4" pathLength="1" stroke-dasharray="0 1" stroke-linecap="round"><animate attributeName="stroke-dasharray" values="0 1;1 0" begin=".15s" dur="1.65s" fill="freeze"/></path>
<circle cx="93" cy="112" r="5" fill="#A84F3A"/><circle cx="823" cy="130" r="5" fill="#A84F3A"/><path d="M807 119L824 130L806 138" fill="none" stroke="#A84F3A" stroke-width="2"/>
<g opacity="0"><text x="78" y="193" font-family="'Barlow Condensed',Impact,sans-serif" font-size="19" letter-spacing="3" fill="#536D60">A TRAVEL JOURNAL, NOT A CHECKLIST</text><animate attributeName="opacity" values="0;1" begin=".25s" dur=".35s" fill="freeze"/><animate attributeName="letter-spacing" values="7px;3px" begin=".25s" dur=".55s" fill="freeze"/></g>
<g opacity="0"><text x="72" y="315" font-family="'DM Serif Display',Georgia,serif" font-size="112" letter-spacing="-3" fill="#26312C">Places,</text><animate attributeName="opacity" values="0;1" begin=".45s" dur=".6s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 32;0 0" begin=".45s" dur=".72s" calcMode="spline" keySplines=".18 .82 .22 1" fill="freeze"/></g>
<g opacity="0"><text x="72" y="416" font-family="'DM Serif Display',Georgia,serif" font-size="112" font-style="italic" letter-spacing="-4" fill="#A84F3A">plates &amp;</text><animate attributeName="opacity" values="0;1" begin=".95s" dur=".55s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="-34 0;0 0" begin=".95s" dur=".68s" calcMode="spline" keySplines=".2 .78 .2 1" fill="freeze"/><animate attributeName="letter-spacing" values="5px;-4px" begin=".95s" dur=".7s" fill="freeze"/></g>
<g opacity="0"><text x="72" y="518" font-family="'Barlow Condensed',Impact,sans-serif" font-size="112" font-weight="600" letter-spacing="5" fill="#26312C">PERSPECTIVE.</text><animate attributeName="opacity" values="0;1" begin="1.48s" dur=".48s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 30;0 0" begin="1.48s" dur=".62s" calcMode="spline" keySplines=".18 .82 .22 1" fill="freeze"/><animate attributeName="letter-spacing" values="14px;5px" begin="1.48s" dur=".8s" fill="freeze"/></g>
<path d="M82 548C182 569 288 555 393 570" fill="none" stroke="#A84F3A" stroke-width="4" stroke-linecap="round" pathLength="1" stroke-dasharray="0 1"><animate attributeName="stroke-dasharray" values="0 1;1 0" begin="2.05s" dur=".72s" fill="freeze"/></path>
<g clip-path="url(#coverCopy)"><text x="84" y="601" font-family="'DM Sans',Arial,sans-serif" font-size="20" fill="#39433D">I travel to see a little further,</text><text x="84" y="630" font-family="'DM Sans',Arial,sans-serif" font-size="20" fill="#39433D">taste something new, and bring a story home.</text></g>
<path d="M890 90L1337 112L1313 588L867 566Z" fill="#C39B5A"/><path d="M905 91L1324 112L1304 570L884 548Z" fill="#FFFAF0" stroke="#26312C" stroke-width="1.4"/>
