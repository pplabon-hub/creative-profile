<g transform="translate(1249 158)"><g transform="rotate(8)"><circle r="58" fill="#F1E7D7" stroke="#A84F3A" stroke-width="2"/><circle r="49" fill="none" stroke="#A84F3A" stroke-width="1" stroke-dasharray="2 5"/><text y="-9" text-anchor="middle" font-family="'Barlow Condensed',Impact,sans-serif" font-size="13" letter-spacing="2" fill="#A84F3A">GO WHERE</text><text y="10" text-anchor="middle" font-family="'Barlow Condensed',Impact,sans-serif" font-size="18" letter-spacing="1.4" fill="#A84F3A">CURIOSITY</text><text y="28" text-anchor="middle" font-family="'Barlow Condensed',Impact,sans-serif" font-size="13" letter-spacing="2" fill="#A84F3A">LEADS</text><animateTransform attributeName="transform" type="rotate" values="8 0 0;10 0 0;8 0 0" begin="2s" dur="9s" repeatCount="indefinite"/></g></g>
<text x="900" y="614" font-family="'Caveat',cursive" font-size="30" fill="#536D60" transform="rotate(-3 900 614)">leave room for one more bite</text><text x="1376" y="632" text-anchor="end" font-family="'IBM Plex Mono',monospace" font-size="11" letter-spacing="2" fill="#536D60">OPEN THE NOTEBOOK →</text>
