<g opacity="0"><text x="1350" y="490" text-anchor="end" font-family="'IBM Plex Mono',monospace" font-size="11" letter-spacing="2" fill="#536D60">TO BE CONTINUED...</text><animate attributeName="opacity" values="0;1" begin="3.15s" dur=".5s" fill="freeze"/></g>
