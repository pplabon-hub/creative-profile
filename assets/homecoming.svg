<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 560" role="img" aria-labelledby="title desc">
<title id="title">The journey keeps working.</title><desc id="desc">A final travel journal chapter with animated condensed capitals, an italic serif headline, notebook entries and a drawn desk scene.</desc>
<defs><pattern id="homePaper" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M0 21.5H22" stroke="#B9AD98" stroke-opacity=".13"/></pattern></defs>
<rect width="1440" height="560" rx="8" fill="#E8DDCA"/><rect width="1440" height="560" rx="8" fill="url(#homePaper)"/><path d="M42 42H1398" stroke="#26312C" stroke-opacity=".38"/>
<g opacity="0"><text x="62" y="30" font-family="'IBM Plex Mono',monospace" font-size="12" letter-spacing="2.5" fill="#536D60">CHAPTER 04 / AFTER THE RETURN</text><animate attributeName="opacity" values="0;1" begin=".12s" dur=".45s" fill="freeze"/><animate attributeName="letter-spacing" values="6px;2.5px" begin=".12s" dur=".55s" fill="freeze"/></g>
<g opacity="0"><text x="70" y="173" font-family="'Barlow Condensed',Impact,sans-serif" font-size="86" font-weight="600" letter-spacing="2" fill="#26312C">THE JOURNEY</text><animate attributeName="opacity" values="0;1" begin=".35s" dur=".55s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="-35 0;0 0" begin=".35s" dur=".72s" calcMode="spline" keySplines=".2 .8 .2 1" fill="freeze"/><animate attributeName="letter-spacing" values="10px;2px" begin=".35s" dur=".7s" fill="freeze"/></g>
<g opacity="0"><text x="70" y="269" font-family="'DM Serif Display',Georgia,serif" font-size="90" font-style="italic" fill="#BE563C">keeps working.</text><animate attributeName="opacity" values="0;1" begin=".95s" dur=".55s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 28;0 0" begin=".95s" dur=".72s" calcMode="spline" keySplines=".2 .8 .2 1" fill="freeze"/><animate attributeName="letter-spacing" values="8px;0px" begin=".95s" dur=".8s" fill="freeze"/></g>
<path d="M75 302C194 320 293 298 433 311" fill="none" stroke="#A84F3A" stroke-width="3" stroke-linecap="round" pathLength="1" stroke-dasharray="0 1"><animate attributeName="stroke-dasharray" values="0 1;1 0" begin="1.5s" dur=".75s" fill="freeze"/></path>
<g opacity="0"><text x="76" y="365" font-family="'DM Sans',Arial,sans-serif" font-size="21" fill="#39433D">The questions travel home with me.</text><text x="76" y="399" font-family="'DM Sans',Arial,sans-serif" font-size="21" fill="#39433D">Then they find new forms in ideas, tools</text><text x="76" y="433" font-family="'DM Sans',Arial,sans-serif" font-size="21" fill="#39433D">and things worth making.</text><animate attributeName="opacity" values="0;1" begin="1.85s" dur=".55s" fill="freeze"/></g>
<g opacity="0"><text x="77" y="491" font-family="'Caveat',cursive" font-size="37" fill="#536D60">A curious mind rarely unpacks completely.</text><animate attributeName="opacity" values="0;1" begin="2.55s" dur=".6s" fill="freeze"/><animate attributeName="letter-spacing" values="7px;0px" begin="2.55s" dur=".9s" fill="freeze"/></g>
<path d="M868 89L1343 108L1321 456L846 436Z" fill="#B38B4A"/><path d="M875 104L1324 122L1304 438L855 420Z" fill="#F8F0E1" stroke="#26312C" stroke-width="1.5"/><path d="M1092 113L1076 428" stroke="#A89B84" stroke-width="2"/>
<path d="M892 149L1060 156M889 185L1058 192M886 221L1056 228M1112 155L1283 162M1109 191L1280 198M1106 227L1277 234" stroke="#9C9B8A" stroke-width="1.2" stroke-dasharray="2 5"/>
<g opacity="0"><text x="910" y="143" font-family="'IBM Plex Mono',monospace" font-size="11" letter-spacing="1.7" fill="#BE563C">NOTES TO SELF</text><animate attributeName="opacity" values="0;1" begin="1.55s" dur=".4s" fill="freeze"/></g>
<g opacity="0"><text x="910" y="278" font-family="'DM Serif Display',Georgia,serif" font-size="35" fill="#26312C">AI &amp; ideas</text><animate attributeName="opacity" values="0;1" begin="1.8s" dur=".45s" fill="freeze"/><animate attributeName="letter-spacing" values="6px;0px" begin="1.8s" dur=".65s" fill="freeze"/></g>
<g opacity="0"><text x="910" y="321" font-family="'Barlow Condensed',Impact,sans-serif" font-size="32" letter-spacing="2" fill="#536D60">TECHNOLOGY</text><animate attributeName="opacity" values="0;1" begin="2.15s" dur=".4s" fill="freeze"/><animate attributeName="letter-spacing" values="9px;2px" begin="2.15s" dur=".6s" fill="freeze"/></g>
<g opacity="0"><text x="910" y="362" font-family="'Caveat',cursive" font-size="34" fill="#BE563C">business / creative work</text><animate attributeName="opacity" values="0;1" begin="2.5s" dur=".5s" fill="freeze"/><animate attributeName="letter-spacing" values="7px;0px" begin="2.5s" dur=".8s" fill="freeze"/></g>
