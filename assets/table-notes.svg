<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 560" role="img" aria-labelledby="title desc">
<title id="title">The table is another map.</title>
<desc id="desc">A hand-illustrated food journal spread with a plate, cutlery, chopsticks, a checked tablecloth and gently moving steam.</desc>
<defs>
  <pattern id="checks" width="28" height="28" patternUnits="userSpaceOnUse">
    <rect width="28" height="28" fill="#E7D5BA"/>
    <rect width="14" height="14" fill="#A84F3A" opacity=".78"/>
    <rect x="14" y="14" width="14" height="14" fill="#A84F3A" opacity=".78"/>
  </pattern>
  <pattern id="grain" width="12" height="12" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r=".7" fill="#26312C" opacity=".12"/>
    <circle cx="9" cy="7" r=".6" fill="#26312C" opacity=".09"/>
  </pattern>
</defs>

<rect width="1440" height="560" rx="8" fill="#536D60"/>
<rect width="1440" height="560" rx="8" fill="url(#grain)"/>
<path d="M0 454L1440 414V560H0Z" fill="url(#checks)"/>
<path d="M0 454L1440 414" stroke="#F1E7D7" stroke-width="8"/>
<text x="66" y="65" font-family="'IBM Plex Mono',monospace" font-size="12" letter-spacing="2.4" fill="#EADFCB">CHAPTER 02  /  THE TABLE</text>
<text x="60" y="178" font-family="'DM Serif Display',Georgia,serif" font-size="78" fill="#F1E7D7">The table is</text>
<text x="60" y="268" font-family="'DM Serif Display',Georgia,serif" font-size="90" font-style="italic" fill="#E4B96F">another map.</text>
<path d="M68 301C192 284 295 310 415 292" fill="none" stroke="#E4B96F" stroke-width="3" stroke-linecap="round"/>
<text x="68" y="354" font-family="'DM Sans',Arial,sans-serif" font-size="21" fill="#F1E7D7">I’m a food lover. A place has a flavour,</text>
<text x="68" y="386" font-family="'DM Sans',Arial,sans-serif" font-size="21" fill="#F1E7D7">a rhythm, and stories gathered around its table.</text>
<text x="70" y="428" font-family="'Caveat',cursive" font-size="32" fill="#F1E7D7">Always curious about what’s cooking.</text>

<!-- drawn table setting, deliberately illustrative rather than a fake food photograph -->
<path d="M800 92L1260 92L1292 452L770 452Z" fill="#E6D8BF" stroke="#26312C" stroke-width="2"/>
<path d="M815 109L1246 109L1273 433L791 433Z" fill="none" stroke="#A84F3A" stroke-width="1.4" stroke-dasharray="5 6"/>
<ellipse cx="1045" cy="274" rx="182" ry="147" fill="#C4B69C" opacity=".42"/>
<ellipse cx="1045" cy="255" rx="176" ry="140" fill="#F5EBDD" stroke="#26312C" stroke-width="3"/>
<ellipse cx="1045" cy="255" rx="150" ry="116" fill="none" stroke="#536D60" stroke-width="2"/>
<ellipse cx="1045" cy="255" rx="126" ry="93" fill="none" stroke="#A84F3A" stroke-width="1.5" stroke-dasharray="2 7"/>
<path d="M987 248C1004 215 1037 204 1063 224C1080 237 1092 255 1106 267" fill="none" stroke="#536D60" stroke-width="5" stroke-linecap="round"/>
<path d="M996 277C1018 254 1047 259 1065 278S1100 298 1113 280" fill="none" stroke="#A84F3A" stroke-width="5" stroke-linecap="round"/>
<circle cx="1031" cy="242" r="8" fill="#B38B4A"/>
<circle cx="1081" cy="292" r="7" fill="#536D60"/>
<circle cx="1004" cy="296" r="5" fill="#A84F3A"/>
<path d="M936 145C912 115 947 105 928 78M1000 135C980 103 1015 92 995 64M1065 136C1040 103 1080 85 1058 54" fill="none" stroke="#F1E7D7" stroke-width="3" stroke-linecap="round" stroke-dasharray="5 5">
  <animate attributeName="stroke-dashoffset" values="0;-40" dur="8s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values=".35;1;.35" dur="5s" repeatCount="indefinite"/>
</path>
<!-- chopsticks -->
<path d="M1190 120L1304 260M1208 108L1320 247" stroke="#A84F3A" stroke-width="7" stroke-linecap="round"/>
<path d="M1270 346L1340 445M1301 338L1371 437" stroke="#26312C" stroke-width="5" stroke-linecap="round"/>
<!-- fork and spoon -->
<path d="M856 183V364M842 183V228M856 183V228M870 183V228" stroke="#536D60" stroke-width="4" stroke-linecap="round"/>
<path d="M917 186C890 189 892 232 917 245C942 232 944 189 917 186ZM917 245V366" fill="none" stroke="#536D60" stroke-width="4"/>
<text x="1017" y="500" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="12" letter-spacing="2" fill="#26312C">TASTE / NOTICE / REMEMBER</text>
<g transform="translate(1335 80) rotate(9)">
  <rect x="-65" y="-25" width="130" height="50" fill="#A84F3A"/>
  <text y="6" text-anchor="middle" font-family="'Barlow Condensed',Impact,sans-serif" font-size="20" letter-spacing="2" fill="#F1E7D7">FOOD NOTES</text>
</g>
</svg>