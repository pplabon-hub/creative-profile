<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 500" role="img" aria-labelledby="title desc">
<title id="title">On the workbench. Ideas in motion.</title>
<desc id="desc">A dark, electric workbench with three playful colour panels and a portrait photograph, representing current experiments in AI, digital systems and creative technology.</desc>
<defs>
  <clipPath id="workPortrait"><path d="M1117 86H1326Q1352 86 1352 112V394Q1352 420 1326 420H1117Q1091 420 1091 394V112Q1091 86 1117 86Z"/></clipPath>
  <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="12"/></filter>
</defs>
<rect width="1440" height="500" rx="16" fill="#1B2032"/>
<circle cx="1310" cy="160" r="225" fill="#5E5AE8" opacity=".75"/>
<circle cx="1260" cy="345" r="105" fill="#FF704F" opacity=".95"><animate attributeName="r" values="95;112;95" dur="6s" repeatCount="indefinite"/></circle>
<path d="M0 395C205 335 330 450 530 412S875 330 1090 420L1090 500H0Z" fill="#252A42"/>
<text x="64" y="64" font-family="'IBM Plex Mono',monospace" font-size="13" letter-spacing="2.5" fill="#45CDBD">FIELD NOTES / ACTIVE EXPERIMENTS</text>
<text x="64" y="155" font-family="'Bricolage Grotesque',sans-serif" font-size="84" font-weight="800" letter-spacing="-3" fill="#F7F0E5">On the</text>
<text x="64" y="245" font-family="'Instrument Serif',Georgia,serif" font-size="100" font-style="italic" fill="#D9F45C">workbench.</text>
<text x="68" y="286" font-family="'Space Grotesk',sans-serif" font-size="18" fill="#D6D7E5">A few things I’m learning, testing and shaping.</text>
<g transform="translate(66 332)">
  <rect x="0" y="0" width="270" height="112" rx="14" fill="#D9F45C"/>
  <text x="20" y="28" font-family="'IBM Plex Mono',monospace" font-size="11" letter-spacing="1.2" fill="#1B2032">FIELD / 01</text>
  <text x="20" y="69" font-family="'Bricolage Grotesque',sans-serif" font-size="28" font-weight="800" fill="#1B2032">AI experiments</text>
  <text x="20" y="94" font-family="'Space Grotesk',sans-serif" font-size="13" fill="#303349">Tools that remove everyday friction.</text>
  <animateTransform attributeName="transform" type="translate" values="66 342;66 332;66 332" keyTimes="0;.22;1" dur="7s" repeatCount="indefinite"/>
</g>
<g transform="translate(354 332)">
  <rect x="0" y="0" width="270" height="112" rx="14" fill="#5E5AE8"/>
  <text x="20" y="28" font-family="'IBM Plex Mono',monospace" font-size="11" letter-spacing="1.2" fill="#D9F45C">FIELD / 02</text>
  <text x="20" y="69" font-family="'Instrument Serif',Georgia,serif" font-size="35" font-style="italic" fill="#F7F0E5">Digital systems</text>
  <text x="20" y="94" font-family="'Space Grotesk',sans-serif" font-size="13" fill="#F7F0E5">Useful, clear, connected.</text>
  <animateTransform attributeName="transform" type="translate" values="354 352;354 332;354 332" keyTimes="0;.27;1" dur="7s" repeatCount="indefinite"/>
</g>
<g transform="translate(642 332)">
  <rect x="0" y="0" width="270" height="112" rx="14" fill="#FF704F"/>
  <text x="20" y="28" font-family="'IBM Plex Mono',monospace" font-size="11" letter-spacing="1.2" fill="#1B2032">FIELD / 03</text>
  <text x="20" y="69" font-family="'Caveat',cursive" font-size="39" fill="#1B2032">Creative technology</text>
  <text x="20" y="94" font-family="'Space Grotesk',sans-serif" font-size="13" fill="#1B2032">A little motion, a lot of meaning.</text>
  <animateTransform attributeName="transform" type="translate" values="642 362;642 332;642 332" keyTimes="0;.32;1" dur="7s" repeatCount="indefinite"/>
</g>
<rect x="1082" y="78" width="279" height="350" rx="24" fill="#D9F45C" transform="rotate(4 1220 250)"/>
<g clip-path="url(#workPortrait)">
  <image href="portrait-suit.jpg" x="1091" y="86" width="261" height="334" preserveAspectRatio="xMidYMid slice"/>
</g>
<rect x="1091" y="86" width="261" height="334" rx="26" fill="none" stroke="#F7F0E5" stroke-width="3"/>
<text x="1221" y="463" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="11" letter-spacing="1.8" fill="#D9F45C">THINK / MAKE / REFINE</text>
<circle cx="980" cy="120" r="8" fill="#45CDBD"><animate attributeName="cy" values="120;145;120" dur="5s" repeatCount="indefinite"/></circle>
<path d="M948 188l18-18 18 18-18 18z" fill="#D9F45C"><animateTransform attributeName="transform" type="rotate" from="0 966 188" to="360 966 188" dur="12s" repeatCount="indefinite"/></path>
</svg>