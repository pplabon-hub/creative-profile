<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 470" role="img" aria-labelledby="title desc">
<title id="title">On the workbench</title>
<desc id="desc">An asymmetric collection of smoked glass panels for AI experiments, digital systems and creative technology.</desc>
<defs>
  <linearGradient id="pane" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#F0EADF" stop-opacity=".17"/>
    <stop offset="1" stop-color="#AAA0AE" stop-opacity=".07"/>
  </linearGradient>
  <filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="24"/></filter>
</defs>
<rect width="1440" height="470" rx="12" fill="#211D24"/>
<circle cx="1260" cy="90" r="220" fill="#B64F3D" opacity=".16" filter="url(#blur)"/>
<circle cx="860" cy="430" r="230" fill="#8C997A" opacity=".13" filter="url(#blur)"/>
<text x="72" y="92" fill="#F0EADF" font-family="'Fraunces', Georgia, serif" font-size="62">On the workbench.</text>
<text x="76" y="128" fill="#AAA0AE" font-family="'IBM Plex Mono', monospace" font-size="12" letter-spacing="2">IDEAS IN MOTION  /  EXPERIMENTS IN PROGRESS</text>

<!-- One broad glass sheet, two differently sized index plates. -->
<rect x="72" y="174" width="660" height="226" rx="18" fill="url(#pane)" stroke="#F0EADF" stroke-opacity=".32"/>
<rect x="90" y="192" width="624" height="190" rx="12" fill="none" stroke="#F0EADF" stroke-opacity=".12"/>
<text x="116" y="236" fill="#B64F3D" font-family="'IBM Plex Mono', monospace" font-size="12" letter-spacing="2">FIELD  /  01</text>
<text x="116" y="300" fill="#F0EADF" font-family="'Fraunces', Georgia, serif" font-size="46">AI experiments</text>
<text x="116" y="342" fill="#D4CDC4" font-family="'Manrope', sans-serif" font-size="17">Building practical tools and workflows</text>
<text x="116" y="368" fill="#D4CDC4" font-family="'Manrope', sans-serif" font-size="17">around everyday problems.</text>

<rect x="786" y="174" width="270" height="226" rx="18" fill="#AAA0AE" fill-opacity=".14" stroke="#F0EADF" stroke-opacity=".28"/>
<text x="816" y="236" fill="#8C997A" font-family="'IBM Plex Mono', monospace" font-size="12" letter-spacing="2">FIELD  /  02</text>
<text x="816" y="294" fill="#F0EADF" font-family="'Fraunces', Georgia, serif" font-size="34">Digital</text>
<text x="816" y="334" fill="#F0EADF" font-family="'Fraunces', Georgia, serif" font-size="34" font-style="italic">systems</text>
<path d="M816 365H1018" stroke="#A97E61" stroke-width="1"/>

<rect x="1090" y="214" width="278" height="186" rx="18" fill="#8C997A" fill-opacity=".12" stroke="#F0EADF" stroke-opacity=".26"/>
<text x="1120" y="258" fill="#A97E61" font-family="'IBM Plex Mono', monospace" font-size="12" letter-spacing="2">FIELD  /  03</text>
<text x="1120" y="318" fill="#F0EADF" font-family="'Fraunces', Georgia, serif" font-size="34">Creative</text>
<text x="1120" y="356" fill="#F0EADF" font-family="'Fraunces', Georgia, serif" font-size="34" font-style="italic">technology</text>
<path d="M72 430H1368" stroke="#F0EADF" stroke-opacity=".16"/>
<circle cx="1368" cy="430" r="4" fill="#B64F3D"/>
</svg>
