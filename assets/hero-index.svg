<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 620" role="img" aria-labelledby="title desc">
<title id="title">Ideas have a pulse. Pplabon profile cover.</title>
<desc id="desc">A vibrant editorial cover with animated kinetic typography, electric violet, citrus, coral and teal shapes, and an original portrait photograph.</desc>
<defs>
  <clipPath id="portrait"><path d="M930 93H1308Q1340 93 1340 125V483Q1340 515 1308 515H930Q898 515 898 483V125Q898 93 930 93Z"/></clipPath>
  <linearGradient id="photoTint" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#FF704F" stop-opacity=".12"/>
    <stop offset="1" stop-color="#4949E8" stop-opacity=".08"/>
  </linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="16"/>
  </filter>
</defs>

<rect width="1440" height="620" rx="16" fill="#F7F0E5"/>
<path d="M24 24H1416V596H24Z" fill="none" stroke="#1B2032" stroke-opacity=".12"/>
<text x="70" y="76" font-family="'IBM Plex Mono',monospace" font-size="14" letter-spacing="2.5" fill="#1B2032">PPLABON  /  CREATIVE INDEX</text>
<text x="1370" y="76" text-anchor="end" font-family="'IBM Plex Mono',monospace" font-size="13" letter-spacing="2" fill="#6A61E8">VOL. 01 — ALWAYS IN PROGRESS</text>
<path d="M70 98H1370" stroke="#1B2032" stroke-opacity=".16"/>
<circle cx="70" cy="98" r="5" fill="#FF704F"/>
<circle cx="1370" cy="98" r="5" fill="#45CDBD"/>

<!-- kinetic colour field -->
<circle cx="1170" cy="300" r="250" fill="#5E5AE8">
  <animate attributeName="r" values="238;258;238" dur="8s" repeatCount="indefinite"/>
</circle>
<circle cx="1285" cy="145" r="91" fill="#D9F45C">
  <animate attributeName="cy" values="145;165;145" dur="6s" repeatCount="indefinite"/>
</circle>
<path d="M855 470C910 385 1045 385 1090 455C1133 522 1258 546 1375 466L1375 620H855Z" fill="#FF704F">
  <animate attributeName="d" values="M855 470C910 385 1045 385 1090 455C1133 522 1258 546 1375 466L1375 620H855Z;M855 492C920 405 1038 415 1090 462C1148 516 1265 525 1375 450L1375 620H855Z;M855 470C910 385 1045 385 1090 455C1133 522 1258 546 1375 466L1375 620H855Z" dur="11s" repeatCount="indefinite"/>
</path>
<circle cx="890" cy="180" r="17" fill="#45CDBD">
  <animate attributeName="r" values="12;20;12" dur="4s" repeatCount="indefinite"/>
</circle>
<circle cx="1380" cy="365" r="14" fill="#D9F45C">
  <animate attributeName="cy" values="365;390;365" dur="5s" repeatCount="indefinite"/>
</circle>

<g>
  <text x="76" y="220" font-family="'Bricolage Grotesque',sans-serif" font-size="104" font-weight="800" letter-spacing="-5" fill="#1B2032">
    Ideas have
    <animateTransform attributeName="transform" type="translate" values="0 22;0 0;0 0" keyTimes="0;.18;1" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".15;1;1" keyTimes="0;.18;1" dur="7s" repeatCount="indefinite"/>
  </text>
  <text x="76" y="328" font-family="'Instrument Serif',Georgia,serif" font-size="122" font-style="italic" fill="#FF704F">
    a pulse.
    <animateTransform attributeName="transform" type="translate" values="0 30;0 0;0 0" keyTimes="0;.3;1" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".05;1;1" keyTimes="0;.3;1" dur="7s" repeatCount="indefinite"/>
  </text>
</g>
<text x="82" y="390" font-family="'Space Grotesk',sans-serif" font-size="22" fill="#45475A">I explore the space between</text>
<text x="82" y="422" font-family="'Space Grotesk',sans-serif" font-size="22" font-weight="700" fill="#4949E8">AI, technology, business &amp; design.</text>
<rect x="82" y="455" width="610" height="52" rx="26" fill="#D9F45C"/>
<text x="108" y="489" font-family="'IBM Plex Mono',monospace" font-size="14" font-weight="500" letter-spacing="1.5" fill="#1B2032">CURIOUS MIND  /  PRACTICAL BUILDER</text>
<path d="M82 538H700" stroke="#1B2032" stroke-opacity=".2"/>
<text x="82" y="570" font-family="'Caveat',cursive" font-size="28" fill="#4949E8">Always learning. Always making.</text>

<!-- original portrait, framed as a colour-block editorial cover -->
<rect x="880" y="80" width="480" height="458" rx="34" fill="#1B2032" opacity=".15" filter="url(#shadow)"/>
<rect x="860" y="74" width="490" height="472" rx="34" fill="#D9F45C" transform="rotate(3 1105 310)"/>
<rect x="872" y="70" width="468" height="470" rx="30" fill="#FF704F" transform="rotate(-2 1106 305)"/>
<g clip-path="url(#portrait)">
  <image href="portrait-hero.jpg" x="898" y="93" width="442" height="430" preserveAspectRatio="xMidYMid slice"/>
  <rect x="898" y="93" width="442" height="430" fill="url(#photoTint)"/>
</g>
<path d="M930 93H1308Q1340 93 1340 125V483Q1340 515 1308 515H930Q898 515 898 483V125Q898 93 930 93Z" fill="none" stroke="#F7F0E5" stroke-width="3"/>
<rect x="914" y="110" width="145" height="38" rx="19" fill="#D9F45C"/>
<text x="986" y="135" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="12" font-weight="600" letter-spacing="1.2" fill="#1B2032">PPLABON / 01</text>
<g transform="translate(1303 465)">
  <circle r="28" fill="#45CDBD"/>
  <path d="M-9 0H9M2 -8L10 0L2 8" fill="none" stroke="#1B2032" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <animateTransform attributeName="transform" type="rotate" values="0 0 0;360 0 0" dur="18s" repeatCount="indefinite"/>
</g>

<!-- moving marquee -->
<rect x="0" y="590" width="1440" height="30" fill="#1B2032"/>
<g fill="#F7F0E5" font-family="'IBM Plex Mono',monospace" font-size="13" letter-spacing="2">
  <text x="70" y="611">AI  ✳  BUSINESS  ✳  CREATIVE SYSTEMS  ✳  MOTION  ✳  PRODUCT THINKING  ✳  </text>
  <text x="850" y="611">AI  ✳  BUSINESS  ✳  CREATIVE SYSTEMS  ✳  MOTION  ✳  PRODUCT THINKING  ✳
    <animateTransform attributeName="transform" type="translate" values="0 0;-780 0" dur="18s" repeatCount="indefinite"/>
  </text>
</g>
</svg>