<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 520" role="img" aria-labelledby="title desc">
<title id="title">What I bring back. Reflections from the road.</title>
<desc id="desc">A quiet personal reflection page with a portrait, taped notebook paper, ruled writing lines and a handwritten note.</desc>
<defs>
  <pattern id="ruled" width="20" height="32" patternUnits="userSpaceOnUse">
    <path d="M0 31.5H20" stroke="#8A9B8D" stroke-opacity=".34" stroke-width="1"/>
  </pattern>
  <clipPath id="reflectPhoto"><path d="M135 80L527 96L510 439L118 422Z"/></clipPath>
</defs>
<rect width="1440" height="520" rx="8" fill="#F1E7D7"/>
<path d="M42 38H1398" stroke="#26312C" stroke-opacity=".35"/>
<text x="62" y="27" font-family="'IBM Plex Mono',monospace" font-size="12" letter-spacing="2.2" fill="#536D60">CHAPTER 03  /  REFLECTIONS</text>

<!-- photo plate -->
<path d="M102 69L552 87L528 463L78 444Z" fill="#C39B5A"/>
<path d="M135 80L527 96L510 439L118 422Z" fill="#FFFCF5" stroke="#26312C" stroke-width="1.5"/>
<g clip-path="url(#reflectPhoto)">
  <image href="portrait-suit.jpg" x="115" y="75" width="415" height="370" preserveAspectRatio="xMidYMin slice"/>
</g>
<path d="M135 80L527 96L510 439L118 422Z" fill="none" stroke="#26312C" stroke-width="1.5"/>
<path d="M250 67L393 73L389 104L246 98Z" fill="#D8C9A9" opacity=".9"/>
<text x="155" y="478" font-family="'Caveat',cursive" font-size="31" fill="#A84F3A" transform="rotate(-2 155 478)">a moment between chapters</text>

<!-- letter page -->
<text x="635" y="106" font-family="'Barlow Condensed',Impact,sans-serif" font-size="18" letter-spacing="3" fill="#A84F3A">THE THINGS THAT STAY</text>
<text x="625" y="200" font-family="'DM Serif Display',Georgia,serif" font-size="82" fill="#26312C">What I bring</text>
<text x="625" y="286" font-family="'DM Serif Display',Georgia,serif" font-size="89" font-style="italic" fill="#536D60">back.</text>
<rect x="630" y="312" width="726" height="120" fill="url(#ruled)" opacity=".72"/>
<text x="637" y="343" font-family="'DM Sans',Arial,sans-serif" font-size="19" fill="#39433D">A journey changes more than the view outside the window.</text>
<text x="637" y="376" font-family="'DM Sans',Arial,sans-serif" font-size="19" fill="#39433D">It leaves new questions, different perspectives, and small</text>
<text x="637" y="409" font-family="'DM Sans',Arial,sans-serif" font-size="19" fill="#39433D">details that keep travelling long after the return.</text>
<text x="645" y="476" font-family="'Caveat',cursive" font-size="35" fill="#A84F3A">The best part is seeing the familiar differently.</text>
<g transform="translate(1325 128)"><g transform="rotate(7)">
  <circle r="39" fill="none" stroke="#A84F3A" stroke-width="2.2" stroke-dasharray="3 4"/>
  <path d="M-20 0H20M0-20V20M-14-14L14 14M14-14L-14 14" stroke="#A84F3A" stroke-width="1.5"/>
  <animateTransform attributeName="transform" type="rotate" from="7 0 0" to="367 0 0" dur="45s" repeatCount="indefinite"/>
</g></g>
</svg>