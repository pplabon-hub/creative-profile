<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 520" role="img" aria-labelledby="title desc">
<title id="title">What I bring back. Reflections from the road.</title><desc id="desc">A quiet reflection page with a portrait, two distinct display type styles, revealed notebook writing and a slowly turning compass mark.</desc>
<defs><pattern id="ruled" width="20" height="32" patternUnits="userSpaceOnUse"><path d="M0 31.5H20" stroke="#8A9B8D" stroke-opacity=".34" stroke-width="1"/></pattern><clipPath id="reflectPhoto"><path d="M135 80L527 96L510 439L118 422Z"/></clipPath><clipPath id="reflectCopy"><rect x="637" y="322" width="0" height="125"><animate attributeName="width" values="0;735" begin="1.7s" dur="1.35s" fill="freeze"/></rect></clipPath></defs>
<rect width="1440" height="520" rx="8" fill="#F1E7D7"/><path d="M42 38H1398" stroke="#26312C" stroke-opacity=".35"/>
<g opacity="0"><text x="62" y="27" font-family="'IBM Plex Mono',monospace" font-size="12" letter-spacing="2.2" fill="#536D60">CHAPTER 03 / REFLECTIONS</text><animate attributeName="opacity" values="0;1" begin=".1s" dur=".45s" fill="freeze"/></g>

<!-- A printed field-note card instead of an unfilled photograph slot. -->
<g transform="translate(112 78) rotate(-2)">
  <rect width="420" height="368" fill="#3D7894"/>
  <rect x="18" y="18" width="384" height="332" fill="#F8F0E1" stroke="#26312C" stroke-width="1.5"/>
  <rect x="18" y="18" width="384" height="14" fill="#D6A13C"/>
  <text x="43" y="76" font-family="'IBM Plex Mono',monospace" font-size="11" letter-spacing="2" fill="#A84F3A">MARGIN NOTES / AFTER THE TRIP</text>
  <text x="40" y="153" font-family="'DM Serif Display',Georgia,serif" font-size="51" fill="#26312C">Notice</text>
  <text x="40" y="211" font-family="'DM Serif Display',Georgia,serif" font-size="51" font-style="italic" fill="#536D60">the details.</text>
  <path d="M42 240C128 225 215 253 360 236" fill="none" stroke="#A84F3A" stroke-width="3" stroke-linecap="round"/>
  <path d="M44 280H360M44 304H338M44 328H315" stroke="#9C9B8A" stroke-width="1.2" stroke-dasharray="2 5"/>
  <circle cx="348" cy="83" r="20" fill="#A84F3A"/>
  <path d="M338 83H358M348 73V93" stroke="#F8F0E1" stroke-width="2"/>
</g>
<text x="155" y="478" font-family="'Caveat',cursive" font-size="31" fill="#A84F3A" transform="rotate(-2 155 478)">a moment between chapters</text>
<text x="635" y="106" font-family="'Barlow Condensed',Impact,sans-serif" font-size="18" letter-spacing="3" fill="#A84F3A">THE THINGS THAT STAY</text><animate attributeName="opacity" values="0;1" begin=".25s" dur=".4s" fill="freeze"/><animate attributeName="letter-spacing" values="8px;3px" begin=".25s" dur=".6s" fill="freeze"/></g>
<g opacity="0"><text x="625" y="200" font-family="'DM Serif Display',Georgia,serif" font-size="82" fill="#26312C">What I bring</text><animate attributeName="opacity" values="0;1" begin=".55s" dur=".65s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 25;0 0" begin=".55s" dur=".8s" calcMode="spline" keySplines=".2 .8 .2 1" fill="freeze"/><animate attributeName="letter-spacing" values="6px;0px" begin=".55s" dur=".7s" fill="freeze"/></g>
<g opacity="0"><text x="625" y="286" font-family="'Caveat',cursive" font-size="89" fill="#536D60">back.</text><animate attributeName="opacity" values="0;1" begin="1.12s" dur=".6s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 28;0 0" begin="1.12s" dur=".8s" fill="freeze"/><animate attributeName="letter-spacing" values="9px;0px" begin="1.12s" dur=".9s" fill="freeze"/></g>
<rect x="630" y="312" width="726" height="120" fill="url(#ruled)" opacity=".72"/>
<g clip-path="url(#reflectCopy)"><text x="637" y="343" font-family="'DM Sans',Arial,sans-serif" font-size="19" fill="#39433D">A journey changes more than the view outside the window.</text><text x="637" y="376" font-family="'DM Sans',Arial,sans-serif" font-size="19" fill="#39433D">It leaves new questions, different perspectives, and small</text><text x="637" y="409" font-family="'DM Sans',Arial,sans-serif" font-size="19" fill="#39433D">details that keep travelling long after the return.</text></g>
<g opacity="0"><text x="645" y="476" font-family="'Caveat',cursive" font-size="35" fill="#A84F3A">The best part is seeing the familiar differently.</text><animate attributeName="opacity" values="0;1" begin="3s" dur=".55s" fill="freeze"/><animate attributeName="letter-spacing" values="8px;0px" begin="3s" dur=".9s" fill="freeze"/></g>
<g transform="translate(1325 128)"><g><circle r="39" fill="none" stroke="#A84F3A" stroke-width="2.2" stroke-dasharray="3 4"/><path d="M-20 0H20M0-20V20M-14-14L14 14M14-14L-14 14" stroke="#A84F3A" stroke-width="1.5"/><animateTransform attributeName="transform" type="rotate" from="0" to="360" begin="1.4s" dur="45s" repeatCount="indefinite"/></g></g>
</svg>